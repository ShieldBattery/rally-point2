name: Publish coordinator image

# Every commit on main gets an image at ghcr.io/shieldbattery/rp2-coordinator
# tagged with its full SHA (plus a moving `latest`), so a deployment pins a tag
# exactly the way a Cargo git dependency pins a rev — and a rollback is a tag
# flip, not a rebuild. Authentication is the workflow's own GITHUB_TOKEN: no
# stored registry credential exists. For tamper-evident production pinning,
# prefer the image *digest* printed by this run over the SHA tag (tags are
# mutable on every registry; digests are not).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-coordinator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: coordinator/Dockerfile
          # Recompress the base image too, so every layer benefits from zstd
          # rather than only the layer created by this Dockerfile.
          outputs: type=registry,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          tags: |
            ghcr.io/shieldbattery/rp2-coordinator:${{ github.sha }}
            ghcr.io/shieldbattery/rp2-coordinator:latest
          # Links the package to this repository on ghcr.
          labels: |
            org.opencontainers.image.source=https://github.com/ShieldBattery/rally-point2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify zstd image layers
        shell: bash
        env:
          IMAGE: ghcr.io/shieldbattery/rp2-coordinator:${{ github.sha }}
        run: |
          document="$(docker buildx imagetools inspect --raw "$IMAGE")"
          media_type="$(jq -r '.mediaType // empty' <<< "$document")"

          case "$media_type" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              digest="$(
                jq -er '
                  [.manifests[] | select(
                    .platform.os == "linux" and
                    .platform.architecture == "amd64"
                  )] |
                  if length == 1 then .[0].digest
                  else error("expected exactly one runnable linux/amd64 manifest")
                  end
                ' <<< "$document"
              )"
              document="$(docker buildx imagetools inspect --raw "$IMAGE@$digest")"
              ;;
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              ;;
            *)
              echo "Unexpected image media type: $media_type" >&2
              exit 1
              ;;
          esac

          jq -e '
            (.layers | length > 0) and
            all(.layers[];
              .mediaType == "application/vnd.oci.image.layer.v1.tar+zstd"
            )
          ' <<< "$document" > /dev/null || {
            echo "Expected every coordinator image layer to use OCI zstd compression; found:" >&2
            jq -r '.layers[]?.mediaType' <<< "$document" >&2
            exit 1
          }
